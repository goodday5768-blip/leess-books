<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Practical English Usage</title>
<style>
:root{--blue:#0d3880;--link:#004aac;--band:#1a4b9c;--yel:#fbe46a;--ink:#333;--mut:#6b7280;--line:#d9dee7;--bg:#fff;--side:#f6f7f9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:calc(15px*var(--fz,1))/1.5 "Open Sans",-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--link);text-decoration:none}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--band);padding:8px 12px calc(8px) 12px;padding-top:max(8px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center}
.top .bk{background:none;border:0;color:#fff;font-size:calc(26px*var(--fz,1));line-height:1;padding:0 6px}
.pill{background:var(--yel);color:#222;font-weight:600;border-radius:4px 0 0 4px;padding:7px 10px;white-space:nowrap;font-size:calc(14px*var(--fz,1))}
.sbox{flex:1;display:flex;min-width:0}
.sbox input{flex:1;min-width:0;border:0;padding:7px 10px;font:inherit;font-size:calc(15px*var(--fz,1));border-radius:0 4px 4px 0;outline:none}
.top .tc{background:#fff;border:0;border-radius:4px;padding:6px 10px;color:var(--blue);font-weight:600;font-size:calc(14px*var(--fz,1))}
.wrap{max-width:1180px;margin:0 auto;display:flex;gap:24px;padding:14px 16px 60px}
main{flex:1;min-width:0;max-width:860px}
aside{width:280px;flex:none}
@media (max-width:999px){aside{display:none}.wrap{padding:12px 12px 60px}}
@media (min-width:1000px){.top .tc{display:none}}
@media (min-width:1000px){.top .tc.dl{display:inline-block}}
.top .tc.dl.ing{font-variant-numeric:tabular-nums;min-width:52px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;max-width:min(92vw,520px);padding:10px 14px;border-radius:12px;background:#24252b;color:#fff;font-size:calc(14px*var(--fz,1));line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.crumb{font-size:calc(13px*var(--fz,1));color:var(--mut);margin:0 0 6px}
.crumb a{color:var(--link)}
.pg{position:relative;width:100%;background:#fff}
.pg img{display:block;width:100%;height:auto}
.pg .ph{width:100%;background:repeating-linear-gradient(180deg,#f3f4f6 0 22px,#fff 22px 44px)}
.pg a.hl{position:absolute;display:block;border-radius:3px}
.pg a.hl:active,.pg a.hl:hover{background:rgba(0,74,172,.14)}
.nav{display:flex;justify-content:space-between;margin:18px 0 0}
.nav button{background:var(--blue);color:#fff;border:0;border-radius:18px;padding:7px 16px;font-size:calc(13px*var(--fz,1))}
.nav button[disabled]{visibility:hidden}
.flash{animation:fl 1.6s ease-out}
@keyframes fl{0%{background:rgba(251,228,106,.9)}100%{background:transparent}}
.mark{position:absolute;left:0;right:0;height:0}
/* 목차 */
.toc{border:1px solid var(--line);border-radius:4px;background:var(--side);font-size:calc(14px*var(--fz,1))}
.toc h3{margin:0;padding:8px 12px;font-size:calc(14px*var(--fz,1));background:#e9ecf1;border-bottom:1px solid var(--line)}
.toc .dv{display:block;padding:8px 12px 4px}
.toc ul{list-style:none;margin:0;padding:4px 0 8px}
.toc li.s>button{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;padding:5px 12px;color:#494949}
.toc li.s>button b{color:var(--link);width:12px;flex:none;font-weight:700}
.toc li.s.on>button{color:#111;font-weight:600}
.toc ol{list-style:none;margin:0;padding:0 0 4px 32px}
.toc ol a{display:block;padding:3px 8px 3px 0;color:var(--link);font-size:calc(13.5px*var(--fz,1))}
.toc ol a.cur{background:#e3e7ee;color:#111;border-radius:3px;padding-left:4px}
aside .toc{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.drawer{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end}
.drawer[hidden]{display:none}
.drawer .toc{width:min(340px,88vw);height:100%;overflow:auto;border-radius:0;padding-top:env(safe-area-inset-top)}
.drawer .x{position:sticky;top:0;float:right;background:none;border:0;font-size:calc(24px*var(--fz,1));padding:4px 12px}
/* 첫 화면 */
.home h1{font-weight:400;font-size:calc(28px*var(--fz,1));margin:6px 0 2px;color:#222}
.home .by{color:var(--mut);margin:0 0 16px}
.home .lead{margin:0 0 18px}
.home h2{font-weight:400;font-size:calc(20px*var(--fz,1));margin:22px 0 8px;display:flex;align-items:baseline;gap:12px}
.home h2 a{font-size:calc(14px*var(--fz,1))}
.sec{border-top:1px solid var(--line)}
.sec>button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:11px 4px;text-align:left;color:#222;font-size:calc(16px*var(--fz,1))}
.sec>button b{color:var(--link);font-size:calc(18px*var(--fz,1));width:14px}
.sec>button .no{color:var(--mut);font-size:calc(13px*var(--fz,1));width:26px;flex:none}
.sec ol{list-style:none;margin:0 0 10px;padding:0 0 0 54px}
.sec ol a{display:flex;gap:10px;padding:4px 0}
.sec ol a span{color:var(--mut);width:30px;flex:none}
.hits a{display:block;padding:10px 4px;border-top:1px solid var(--line);color:var(--ink)}
.hits a b{color:var(--link);font-weight:600}
.hits a small{display:block;color:var(--mut);font-size:calc(13px*var(--fz,1))}
.hits mark{background:#fff3a8}
.gate{max-width:380px;margin:60px auto;padding:0 16px;text-align:center}
.gate input{width:100%;padding:11px;font-size:calc(16px*var(--fz,1));border:1px solid #c5ccd8;border-radius:6px;margin:12px 0}
.gate button{width:100%;padding:11px;background:var(--blue);color:#fff;border:0;border-radius:6px;font-size:calc(16px*var(--fz,1))}
.gate .msg{color:#b91c1c;min-height:1.4em;margin-top:8px}
.note{color:var(--mut);font-size:calc(13px*var(--fz,1));margin-top:28px}
</style>
<style id="ipadCss">
/* 아이패드 기준 화면(2026-11-09) — 폭 740px 이상(아이패드 세로·가로, 컴퓨터)에서 본문 폭을 넓히고 글자를 키운다. 휴대폰은 그대로. */
@media (min-width:740px) and (min-height:560px){
:root{--fz:1.22}
main{max-width:1100px!important}
.wrap{padding-left:26px!important;padding-right:26px!important}
.brand img{max-width:640px!important}
input[type=radio],input[type=checkbox]{width:19px;height:19px}
.lock,.gate{max-width:600px!important}
#pwaSheet .pwa-box{max-width:620px!important}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* PEU 온라인판 뷰어(2026-10-03) — 옥스퍼드 PEU 화면 저장 PDF(1~28장)를 본문 단만 잘라 암호화(peuol.py). 11-05 29~31장은 4판 책 스캔(peubook.py).
   내용 열쇠는 선생님 코드(leess:tcode) 또는 학생 코드(leess:scode)로 푼다. 주소: #/ · #/s/3 · #/e/30 · #/e/30.2 · #/q/검색어 */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); };
  var ls = {get: function (k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
            set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }};
  var B = 'books/peuol/', app = $('app'), K = null, M = null, TEXT = null, cache = new Map();
  try { if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}   // 오프라인(10-03)
  // 기기 저장(10-03): 받은 파일(암호화된 그대로)을 Cache Storage 'lb:peuol:<판>'에 — 판(PV)은 site_books.py가 meta.bin 시각으로 넣는다
  var PV = 1793878248, CN = 'lb:peuol:' + PV, CS = null;
  try { if (window.caches) { CS = caches.open(CN).catch(function () { return null; });
    caches.keys().then(function (ks) { ks.forEach(function (k) { if (k.indexOf('lb:peuol:') === 0 && k !== CN) caches.delete(k); }); }).catch(function () {}); } } catch (e) { CS = null; }

  function back() {
    var h = ''; try { h = sessionStorage.getItem('hub:back') || ''; } catch (e) {}
    if (h) { location.href = h; return; }
    location.href = location.origin + (ls.get('leess:tcode') ? '/leess-teacher/#/teacher-books' : '/leess/#/teacher-books');
  }
  async function fetchBin(name) {
    var url = B + name, c = CS && await CS, r = null;
    if (c) try { r = await c.match(url); } catch (e) { r = null; }
    if (!r) {
      r = await fetch(url, /^(key|meta|text)/.test(name) ? {cache: 'no-cache'} : {});
      if (!r.ok) throw new Error('http ' + r.status);
      if (c) try { c.put(url, r.clone()).catch(function () {}); } catch (e) {}
    }
    return new Uint8Array(await r.arrayBuffer());
  }
  // 책 전체 받아 두기(10-03): 모든 쪽 + 검색 본문 → 이 기기에서 인터넷 없이도 열림
  var DLK = 'book:peuol:dl';
  function toast(msg, ms) {
    var t = document.querySelector('.toast') || document.body.appendChild(Object.assign(document.createElement('div'), {className: 'toast'}));
    t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, ms || 4000);
  }
  function dlSetup() {
    var b = $('dlB'), busy = false, stop = false;
    function label() { var ok = ls.get(DLK) === PV; b.textContent = ok ? '✓' : '⬇'; b.classList.remove('ing'); b.title = ok ? '이 기기에 받아 두었습니다 — 인터넷 없이도 열림' : '책 전체 받아 두기(약 47MB) — 수업 전에 와이파이에서 한 번'; }
    label();
    b.onclick = async function () {
      if (busy) { stop = true; toast('멈추는 중…'); return; }
      var c = CS && await CS;
      if (!c) return toast('이 브라우저는 기기 저장을 지원하지 않습니다.');
      if (ls.get(DLK) === PV) return toast('이미 받아 두었습니다. 이 기기에서는 인터넷 없이도 열립니다.');
      var names = ['text.bin'];
      for (var i = 1; i <= M.pages.length; i++) names.push('p' + String(i).padStart(4, '0') + '.bin');
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}
      busy = true; stop = false; b.classList.add('ing'); toast('책 전체(약 47MB)를 받는 중입니다. 다시 누르면 멈춥니다.', 5000);
      var k = 0, done = 0, fail = 0, full = false;
      async function work() {
        while (k < names.length && !stop && !full) {
          var url = B + names[k++];
          try { if (!(await c.match(url))) { var r = await fetch(url); if (!r.ok) throw new Error('http'); await c.put(url, r); } done++; }
          catch (e) { if (e && e.name === 'QuotaExceededError') full = true; else fail++; }
          b.textContent = Math.floor(done * 100 / names.length) + '%';
        }
      }
      await Promise.all([work(), work(), work()]);
      busy = false;
      if (!stop && !full && !fail) { ls.set(DLK, PV); toast('다 받았습니다. 이제 이 기기에서는 인터넷 없이도 PEU를 열 수 있습니다.', 6000); }
      else toast(full ? '기기 저장 공간이 모자라 멈췄습니다.' : stop ? '멈췄습니다. 받은 쪽은 남아 있어 다음에 이어 받습니다.' : '일부(' + fail + '개)를 받지 못했습니다. 인터넷을 확인하고 다시 누르세요.', 6000);
      label();
    };
  }
  async function dec(key, b) { return crypto.subtle.decrypt({name: 'AES-GCM', iv: b.slice(0, 12)}, key, b.slice(12)); }
  async function unwrap(code, which) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    var kk = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: new TextEncoder().encode('leess-books:peuol'), iterations: 100000, hash: 'SHA-256'},
      base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    var raw = await dec(kk, await fetchBin('key.' + which + '.bin'));
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  }
  async function gunzipJson(buf) {
    var s = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(s).text());
  }
  async function tryCode(code) {   // 선생님 열쇠 → 학생 열쇠 순서
    for (var w of ['t', 's']) {
      try { var k = await unwrap(code, w); return {k: k, w: w}; } catch (e) { if (/http/.test(String(e))) throw e; }
    }
    return null;
  }
  function gate(msg) {
    app.innerHTML = '<div class="top"><button class="bk" id="bk" aria-label="뒤로">‹</button><span class="pill" style="border-radius:4px">Practical English Usage</span></div>' +
      '<div class="gate"><h2>코드 입력</h2><p>이 교재는 잠겨 있습니다. 선생님 코드나 학생 코드를 한 번 넣으면 다음부터 자동으로 열립니다.</p>' +
      '<input type="password" id="gc" placeholder="코드" autocomplete="off"><button id="go">열기</button><div class="msg" id="gm">' + esc(msg || '') + '</div></div>';
    $('bk').onclick = back;
    $('go').onclick = async function () {
      var c = $('gc').value.trim(); if (!c) return;
      $('gm').textContent = '여는 중…';
      try {
        var r = await tryCode(c);
        if (!r) { $('gm').textContent = '코드가 맞지 않습니다.'; return; }
        ls.set(r.w === 't' ? 'leess:tcode' : 'leess:scode', c); K = r.k; start();
      } catch (e) { $('gm').textContent = '파일을 불러오지 못했습니다. 인터넷 연결을 확인하세요.'; }
    };
    $('gc').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('go').click(); });
    $('gc').focus();
  }
  async function boot() {
    app.innerHTML = '<p style="padding:40px;text-align:center;color:#6b7280">불러오는 중…</p>';
    var codes = [['t', ls.get('leess:tcode')], ['s', ls.get('leess:scode')]];
    for (var c of codes) {
      if (!c[1]) continue;
      try { K = await unwrap(c[1], c[0]); break; } catch (e) {
        if (/http/.test(String(e))) return gate('파일을 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
      }
    }
    if (!K) return gate('');
    start();
  }
  async function start() {
    try { M = await gunzipJson(await dec(K, await fetchBin('meta.bin'))); }
    catch (e) { K = null; return gate('파일을 불러오지 못했습니다.'); }
    M.byPage = M.pages;
    shell();
    addEventListener('hashchange', route);
    route();
  }

  /* ---------- 틀 ---------- */
  function tocHTML() {
    return '<div class="toc"><h3>Contents overview</h3><a class="dv" href="#/">see detailed version</a><ul>' +
      M.secs.map(function (s) {
        return '<li class="s" data-s="' + s.n + '"><button type="button"><b>+</b><span>' + esc(s.title) + '</span></button><ol hidden>' +
          '<li><a href="#/s/' + s.n + '" data-p="' + s.intro + '">Introduction</a></li>' +
          s.entries.map(function (e) { return '<li><a href="#/e/' + e.n + '" data-p="' + e.p + '">' + esc(e.t) + '</a></li>'; }).join('') + '</ol></li>';
      }).join('') + '</ul></div>';
  }
  function bindToc(root) {
    root.querySelectorAll('li.s>button').forEach(function (b) {
      b.onclick = function () { var li = b.parentNode, ol = li.querySelector('ol'); ol.hidden = !ol.hidden; li.classList.toggle('on', !ol.hidden); b.querySelector('b').textContent = ol.hidden ? '+' : '−'; };
    });
    root.querySelectorAll('ol a').forEach(function (a) { a.addEventListener('click', function () { $('dr').hidden = true; }); });
  }
  function markToc(pid) {
    document.querySelectorAll('.toc').forEach(function (t) {
      t.querySelectorAll('a.cur').forEach(function (a) { a.classList.remove('cur'); });
      var a = t.querySelector('ol a[data-p="' + pid + '"]'); if (!a) return;
      a.classList.add('cur');
      var li = a.closest('li.s'), ol = li.querySelector('ol');
      if (ol.hidden) { ol.hidden = false; li.classList.add('on'); li.querySelector('b').textContent = '−'; }
    });
  }
  function shell() {
    app.innerHTML = '<div class="top"><button class="bk" id="bk" aria-label="뒤로">‹</button>' +
      '<a class="pill" href="#/">Practical English Usage</a><form class="sbox" id="sf"><input id="q" type="search" placeholder="Search PEU (번호·제목·본문)" enterkeyhint="search"></form>' +
      '<button class="tc" id="tc" type="button">목차</button><button class="tc dl" id="dlB" type="button" aria-label="책 전체 받아 두기">⬇</button></div>' +
      '<div class="wrap"><main id="main"></main><aside id="side">' + tocHTML() + '</aside></div>' +
      '<div class="drawer" id="dr" hidden><div class="toc-host" style="height:100%">' + tocHTML().replace('<div class="toc">', '<div class="toc"><button class="x" id="dx" type="button">×</button>') + '</div></div>';
    $('bk').onclick = back;
    dlSetup();
    $('tc').onclick = function () { $('dr').hidden = false; };
    $('dr').onclick = function (e) { if (e.target === $('dr')) $('dr').hidden = true; };
    $('dx').onclick = function () { $('dr').hidden = true; };
    bindToc($('side')); bindToc($('dr'));
    $('sf').onsubmit = function (e) {
      e.preventDefault(); var v = $('q').value.trim(); if (!v) return;
      var m = v.match(/^(\d{1,3})(?:\.(\d{1,2}))?$/);
      if (m && M.ent[m[1]] != null) { location.hash = '#/e/' + v; } else { location.hash = '#/q/' + encodeURIComponent(v); }
      $('q').blur();
    };
  }

  /* ---------- 화면 ---------- */
  function route() {
    var h = location.hash.replace(/^#\/?/, ''), m;
    if ((m = h.match(/^s\/(\d+)/))) { var s = M.secs.filter(function (x) { return x.n === +m[1]; })[0]; if (s) return page(s.intro, null); }
    if ((m = h.match(/^e\/(\d+)(?:\.(\d+))?/))) { var p = M.ent[m[1]]; if (p != null) return page(p, m[2] ? +m[2] : null); }
    if ((m = h.match(/^q\/(.+)/))) return search(decodeURIComponent(m[1]));
    home();
  }
  function home() {
    document.title = 'Practical English Usage';
    markToc(-1);
    var last = ls.get('peuol:last');
    $('main').innerHTML = '<div class="home"><h1>Practical English Usage</h1><p class="by">by Michael Swan</p>' +
      (last != null && M.pages[last] ? '<p class="lead">이어 보기: <a href="' + hashOf(last) + '">' + esc(label(last)) + '</a></p>' : '') +
      '<h2>Contents <a href="#" id="ex">모두 펼치기</a></h2>' +
      M.secs.map(function (s) {
        return '<div class="sec"><button type="button"><b>+</b><span class="no">' + s.n + '</span><span>' + esc(s.title) + '</span></button><ol hidden>' +
          '<li><a href="#/s/' + s.n + '"><span></span>Introduction</a></li>' +
          s.entries.map(function (e) { return '<li><a href="#/e/' + e.n + '"><span>' + e.n + '</span>' + esc(e.t) + '</a></li>'; }).join('') + '</ol></div>';
      }).join('') + '<p class="note">1~28장은 PEU 화면 저장본, 29~31장(항목 321–635)은 4판 책 스캔입니다.</p></div>';
    var secs = $('main').querySelectorAll('.sec');
    secs.forEach(function (d) { d.querySelector('button').onclick = function () { var ol = d.querySelector('ol'); ol.hidden = !ol.hidden; d.querySelector('b').textContent = ol.hidden ? '+' : '−'; }; });
    $('ex').onclick = function (e) {
      e.preventDefault(); var open = this.textContent === '모두 펼치기';
      secs.forEach(function (d) { d.querySelector('ol').hidden = !open; d.querySelector('b').textContent = open ? '−' : '+'; });
      this.textContent = open ? '모두 접기' : '모두 펼치기';
    };
    scrollTo(0, 0);
  }

      const c = cards.get(el), v = ident(el, kind);
      if (c) {
        if (INK.busy()) continue;
        if (kind === 'img') { if (v.id !== c.q.id) INK.setRecord(c, recs.get(v.id) || blank(v.id, kind)); }
        else if (kind === 'text' && v.sig !== c.sig) { const keepIt = same(c, v); if (keepIt) c.sig = v.sig; else { INK.setRecord(c, recs.get(v.id) || blank(v.id, kind)); tag(c, v); } }   // 카드는 그대로인데 속 내용이 통째로 바뀐 경우
        continue;
      }
      let q = recs.get(v.id);
      if (!q && kind === 'text') { const g = gone.find(g => g.head === v.head && g.q.id !== v.id && g.probes.every(p => v.n.includes(p))); if (g) { q = {...g.q, id: v.id, s: g.q.s.map(s => ({...s, p: s.p.slice()}))}; save(q); } }
      if (q) mount(el, kind, q, v);
    }
    INK.bar(any);
  }
  const schedule = () => { if (!stimer) stimer = setTimeout(sync, 60); };
  const ours = n => n.nodeType === 1 && n.matches && n.matches(INKSEL);
  const mine = m => {
    const t = m.target.nodeType === 1 ? m.target : m.target.parentElement; if (t && t.closest(INKSEL)) return true;
    if (m.type === 'childList') { const ns = [...m.addedNodes, ...m.removedNodes]; return ns.length > 0 && ns.every(ours); }
    return false;
  };
  new MutationObserver(ms => { if (!ms.every(mine)) schedule(); }).observe(document.body, {childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'src']});
  addEventListener('hashchange', schedule); addEventListener('popstate', schedule);
  NARROW.addEventListener('change', async () => { await flush(); [...cards.values()].forEach(unmount); sync(); INK.status('이 방향에서 쓴 필기만 보입니다'); });

  INK.init({
    save: c => save(c.q), onPen: schedule,
    units() {   // 엔진이 두 손가락 확대로 키울 묶음(2판): 문항 목록(#qs·#exs)은 통째로, 그 밖은 카드 하나씩. 목록·현황·달력 화면은 묶음을 주지 않는다(= 브라우저 확대 그대로)
      const out = new Set();
      for (const [el] of cand) {
        if (!el.isConnected || !vis(el)) continue;
        if (!el.matches('.ink-page,.ink-text') && (el.classList.contains('gc-month') || el.closest('#view,#main'))) continue;
        const p = el.parentElement; out.add(p && (p.id === 'qs' || p.id === 'exs') ? p : el);
      }
      return [...out];
    },
    cardAt(t) {   // 펜이 닿은 자리의 카드 — 필기가 없던 카드는 이때 필기층을 만든다
      cand = candidates(); let el = null; for (let n = t; n && n !== document.body; n = n.parentElement) if (cand.has(n)) { el = n; break; }
      if (!el) return null;
      let c = cards.get(el); if (c && c.svg.parentNode !== el) { unmount(c); c = null; }
      if (!c) { const kind = cand.get(el), v = ident(el, kind); c = mount(el, kind, recs.get(v.id) || blank(v.id, kind), v); }
      return c;
    },
  });
  window.BOOKNOTE = {dump: () => tx('readonly', s => s.index('salt').getAll(SALT)), cards: () => cards.size};
  load().then(sync);
})();
</script>
